
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#071226">
  <title>Confirmação da compra | E-book Noé</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      gap: 32px;
      background:
        radial-gradient(ellipse at top right, #453717 0%, transparent 38%),
        radial-gradient(ellipse at bottom left, #123a79 0%, transparent 45%),
        #050b17;
      color: #f8fafc;
      font-family: Arial, Helvetica, sans-serif;
    }

    header {
      text-align: center;
      font-size: 19px;
      font-weight: 800;
    }

    header span { color: #ffd338; }

    main {
      width: 100%;
      max-width: 560px;
      padding: 40px 28px;
      text-align: center;
      border: 1px solid #a98210;
      border-radius: 28px;
      background: rgba(7, 18, 38, 0.96);
      box-shadow: 0 20px 70px rgba(0, 0, 0, 0.3);
    }

    .icone {
      width: 78px;
      height: 78px;
      display: grid;
      place-items: center;
      margin: 0 auto 22px;
      border: 2px solid #ffd338;
      border-radius: 50%;
      font-size: 36px;
    }

    h1 {
      margin: 0 0 16px;
      font-size: clamp(27px, 6vw, 38px);
      line-height: 1.15;
    }

    p {
      color: #d1d9e8;
      line-height: 1.7;
    }

    #detalhe {
      overflow-wrap: anywhere;
      font-size: 14px;
      color: #a9bad4;
    }

    .botao {
      width: 100%;
      min-height: 60px;
      margin-top: 22px;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      padding: 16px 20px;
      border: 0;
      border-radius: 16px;
      background: linear-gradient(#ffe46c, #ffc928);
      box-shadow: 0 6px 0 #b88700;
      color: #101010;
      font-size: 17px;
      font-weight: 800;
      text-decoration: none;
      cursor: pointer;
    }

    .botao:disabled {
      cursor: wait;
      opacity: 0.7;
    }

    .secundario {
      display: inline-block;
      margin-top: 26px;
      color: #d1d9e8;
      text-decoration: underline;
    }

    footer {
      text-align: center;
      font-size: 13px;
      color: #9aacc8;
    }

    [hidden] { display: none !important; }

    @media (max-width: 420px) {
      main { padding: 32px 20px; }
    }
  </style>
</head>

<body>
  <header>Noé <span>e-book</span></header>

  <main>
    <div class="icone" id="icone" aria-hidden="true">⌛</div>

    <h1 id="titulo">Verificando seu pagamento</h1>

    <p id="mensagem" aria-live="polite">
      Estamos consultando o status do pedido no sistema de pagamentos.
    </p>

    <p id="detalhe">A consulta é automática.</p>

    <a id="botaoDownload" class="botao" href="#" hidden>
      Baixar meu e-book
    </a>

    <button id="botaoVerificar" class="botao" type="button">
      Verificar agora
    </button>

    <a class="secundario" href="./">Voltar à página do e-book</a>
  </main>

  <footer>Produzido por André Santos · Produto digital em PDF</footer>

  <script>
    const API_URL =
      "https://ebook-noe-vendas-api-teste.contato-andresantosapps.workers.dev";

    const parametros = new URLSearchParams(window.location.search);
    const referencia = parametros.get("ref");

    const icone = document.getElementById("icone");
    const titulo = document.getElementById("titulo");
    const mensagem = document.getElementById("mensagem");
    const detalhe = document.getElementById("detalhe");
    const botaoDownload = document.getElementById("botaoDownload");
    const botaoVerificar = document.getElementById("botaoVerificar");

    let temporizador = null;
    let consultando = false;
    let encerrado = false;

    function mostrarErro(texto) {
      icone.textContent = "!";
      titulo.textContent = "Não foi possível verificar";
      mensagem.textContent = texto;
      detalhe.textContent =
        "Tente verificar novamente. Não faça outra compra antes de conferir o pedido.";
      botaoDownload.hidden = true;
      botaoVerificar.hidden = false;
      botaoVerificar.disabled = false;
      botaoVerificar.textContent = "Tentar novamente";
    }

    function mostrarPendente() {
      icone.textContent = "⌛";
      titulo.textContent = "Aguardando a confirmação";
      mensagem.textContent =
        "Seu pagamento ainda não foi confirmado pelo sistema. Assim que a aprovação for registrada, o download será liberado.";
      detalhe.textContent =
        "A página consulta o pedido automaticamente a cada 5 segundos.";
      botaoDownload.hidden = true;
      botaoVerificar.hidden = false;
      botaoVerificar.disabled = false;
      botaoVerificar.textContent = "Verificar agora";
    }

    function mostrarAprovado(url) {
      encerrado = true;
      if (temporizador) clearInterval(temporizador);

      icone.textContent = "✓";
      titulo.textContent = "Pagamento confirmado!";
      mensagem.textContent =
        "Tudo certo! Seu e-book está disponível para baixar.";
      detalhe.textContent = "Noé — A Fé em Meio à Tempestade";
      botaoDownload.href = url;
      botaoDownload.hidden = false;
      botaoVerificar.hidden = true;
    }

    async function verificarPedido() {
      if (consultando || encerrado) return;

      if (!referencia || !/^[0-9a-f-]{36}$/i.test(referencia)) {
        encerrado = true;
        mostrarErro("A referência do pedido está ausente ou é inválida.");
        return;
      }

      consultando = true;
      botaoVerificar.disabled = true;
      botaoVerificar.textContent = "Consultando...";

      try {
        const resposta = await fetch(
          `${API_URL}/pedido?ref=${encodeURIComponent(referencia)}`,
          {
            method: "GET",
            cache: "no-store",
          }
        );

        const dados = await resposta.json().catch(() => ({}));

        if (resposta.status === 404) {
          encerrado = true;
          if (temporizador) clearInterval(temporizador);
          mostrarErro(
            "O pedido não foi encontrado no armazenamento do sistema. A compra precisa ser investigada."
          );
          return;
        }

        if (!resposta.ok) {
          throw new Error("O servidor não conseguiu consultar o pedido.");
        }

        if (dados.status === "approved" && dados.download_url) {
          const urlDownload = new URL(dados.download_url, API_URL);

          if (urlDownload.origin !== new URL(API_URL).origin) {
            throw new Error("Endereço de download inválido.");
          }

          mostrarAprovado(urlDownload.href);
          return;
        }

        mostrarPendente();
      } catch (erro) {
        console.error("Erro ao consultar pedido:", erro);
        mensagem.textContent =
          "Não foi possível consultar o servidor agora. O sistema tentará novamente.";
        detalhe.textContent =
          "Confira sua conexão. O download continua bloqueado até a confirmação.";
        botaoVerificar.hidden = false;
        botaoVerificar.disabled = false;
        botaoVerificar.textContent = "Tentar novamente";
      } finally {
        consultando = false;
      }
    }

    botaoVerificar.addEventListener("click", verificarPedido);

    verificarPedido();
    temporizador = setInterval(verificarPedido, 5000);
  </script>
</body>
</html>
